<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Not Found | MANIPURA SIA</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>

  <nav class="top-nav">
    <div class="nav-left">
      <a href="index.html" class="btn-glass icon-only" aria-label="Home">
        <i class="fas fa-home"></i>
      </a>
    </div>

    <div class="nav-center">
      <span class="brand-name">MANIPURA SIA</span>
    </div>

    <div class="nav-right">
      <div class="nav-links">
        <a href="product.html" class="btn-glass" data-i18n="nav.product">Product</a>
        <a href="about.html" class="btn-glass" data-i18n="nav.about">About</a>
      </div>

      <div class="lang-dropdown">
        <button class="btn-glass" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span id="currentFlag" class="flag">English</span>
          <i class="fas fa-chevron-down"></i>
        </button>

        <div class="lang-menu" id="langMenu" role="menu">
          <div class="lang-option" data-lang="en"><span class="flag">English</span> </div>
          <div class="lang-option" data-lang="de"><span class="flag">Deutsch</span> </div>
          <div class="lang-option" data-lang="fr"><span class="flag">Français</span> </div>
          <div class="lang-option" data-lang="es"><span class="flag">Español</span> </div>
          <div class="lang-option" data-lang="it"><span class="flag">Italiano</span> </div>
        </div>
      </div>

      <button class="btn-glass mobile-menu-btn" id="burger" type="button" aria-label="Open menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <div class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
    <a href="index.html" class="btn-glass" data-i18n="nav.home">Home</a>
    <a href="product.html" class="btn-glass" data-i18n="nav.product">Product</a>
    <a href="about.html" class="btn-glass" data-i18n="nav.about">About</a>
  </div>



  <!-- Mobile drawer -->
  <div class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
    <div class="mobile-drawer-card">
      <div class="mobile-drawer-header">
        <span class="mobile-title">MANIPURA SIA</span>
        <button class="btn-glass" type="button" id="drawerClose" aria-label="Close menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="mobile-drawer-actions">
        <a href="index.html" class="btn-glass" data-i18n="nav.home">
          <i class="fa-solid fa-house"></i><span>Home</span>
        </a>
        <a href="product.html" class="btn-glass" data-i18n="nav.product">
          <i class="fa-solid fa-bag-shopping"></i><span>Product</span>
        </a>
        <a href="about.html" class="btn-glass" data-i18n="nav.about">
          <i class="fa-solid fa-circle-info"></i><span>About</span>
        </a>

        <div class="mobile-lang">
          <div class="mobile-lang-title" data-i18n="nav.language">Language</div>
          <div class="mobile-lang-list" id="mobileLangList"></div>
        </div>
      </div>
    </div>
  </div>

  <main class="page-wrap">
    <section class="page-card center">
      <div class="error-code">404</div>
      <h1 data-i18n="notfound.title">Page not found</h1>
      <p data-i18n="notfound.desc">This path doesn’t exist. Please go back home.</p>

      <div class="page-actions">
        <a href="index.html" class="btn-glass">
          <i class="fa-solid fa-house"></i>
          <span data-i18n="notfound.back">Return Home</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <span>© <span id="year"></span> MANIPURA SIA</span>
      <span class="footer-dot">·</span>
      <span data-i18n="footer.made">Made for Europe</span>
    </div>
  </footer>

  <div id="toast" class="toast">Copied to clipboard!</div>
  <script src="js/script.js"></script>
</body>
</html>
